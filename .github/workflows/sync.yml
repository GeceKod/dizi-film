name: Scheduled Sync

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"   # Her 30 dakikada bir otomatik çalışır

permissions:
  contents: write            # commit yapabilmek için

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      # -------------------------------------------------
      # 1️⃣ Kod checkout
      # -------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # -------------------------------------------------
      # 2️⃣ Python ortamı
      # -------------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # -------------------------------------------------
      # 3️⃣ Chrome (Selenium) ve Xvfb
      # -------------------------------------------------
      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1

      # -------------------------------------------------
      # 4️⃣ Sistem paketleri (wireguard + gerekli libs)
      # -------------------------------------------------
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            xvfb \
            python3-tk \
            python3-dev \
            scrot \
            libx11-dev \
            libxtst-dev \
            wireguard \
            wireguard-tools \
            resolvconf

      # -------------------------------------------------
      # 5️⃣ Python bağımlılıkları
      # -------------------------------------------------
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install seleniumbase pyautogui pynput curl_cffi \
            beautifulsoup4 requests tmdbsimple deep-translator
          python -m seleniumbase install chromedriver

      # -------------------------------------------------
      # 6️⃣ Çıktı / log klasörleri
      # -------------------------------------------------
      - name: Prepare folders
        run: |
          mkdir -p github_data
          mkdir -p logs

      # -------------------------------------------------
      # 7️⃣ VPN + ev‑proxy (root ile)
      # -------------------------------------------------
      - name: Connect Keenetic VPN & Setup Home Proxy
        env:
          # SSTP kimlik bilgileri (eğer SSTP ihtiyacınız yoksa boş bırakabilirsiniz)
          SSTP_USER: ${{ secrets.SSTP_USER }}
          SSTP_PASS: ${{ secrets.SSTP_PASS }}
        run: |
          sudo -E python setup_vpn_proxy.py

      # -------------------------------------------------
      # 8️⃣ Proxy log / dinleme kontrol (debug)
      # -------------------------------------------------
      - name: Show proxy log (debug)
        if: always()
        run: |
          echo "=== /tmp/proxy.log ==="
          cat /tmp/proxy.log || echo "Log yok (proxy muhtemelen çökmüş)."

      - name: Check proxy listening port
        if: always()
        run: |
          echo "=== ss -ltnp (port 8888) ==="
          ss -ltnp | grep 8888 || echo "Port 8888 dinlenmiyor."

      # -------------------------------------------------
      # 9️⃣ Dizi senkronizasyonu (proxy üzerinden)
      # -------------------------------------------------
      - name: Run series sync
        env:
          HTTP_PROXY: "http://127.0.0.1:8888"
          HTTPS_PROXY: "http://127.0.0.1:8888"
          DIZI_DATA_FILE: github_data/diziler.json
          DIZI_STATE_FILE: github_data/diziler_state.json
          DIZI_LOG_FILE: logs/dizi_sync.log
          DIZI_MAX_LIST_PAGES: "2"
          DIZI_SELENIUM_HEADLESS: "0"
          DIZI_SELENIUM_WAIT: "60"
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" \
            python -X utf8 main_dizi.py

      # -------------------------------------------------
      # 🔟 Film senkronizasyonu (proxy üzerinden)
      # -------------------------------------------------
      - name: Run movie sync
        env:
          HTTP_PROXY: "http://127.0.0.1:8888"
          HTTPS_PROXY: "http://127.0.0.1:8888"
          FILM_DATA_FILE: github_data/movies.json
          FILM_STATE_FILE: github_data/movies_state.json
          FILM_LOG_FILE: logs/film_sync.log
          FILM_MAX_LIST_PAGES: "2"
          FILM_SELENIUM_HEADLESS: "0"
          FILM_SELENIUM_WAIT: "60"
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" \
            python -X utf8 main_film.py

      # -------------------------------------------------
      # 🧩 Çıktı dosyalarını birleştir
      # -------------------------------------------------
      - name: Merge outputs
        env:
          DIZI_DATA_FILE: github_data/diziler.json
          FILM_DATA_FILE: github_data/movies.json
          CIKTI_DOSYASI: github_data/dizipal.json
        run: |
          python -X utf8 json_birlestir.py

      # -------------------------------------------------
      # 📤 Oluşan verileri repo’ya commit et
      # -------------------------------------------------
      - name: Commit generated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add github_data
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Auto update github_data"
            git push
          fi

      # -------------------------------------------------
      # 📂 Log ve proxy artefaktlarını sakla (her zaman)
      # -------------------------------------------------
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sync-logs
          path: logs/

      - name: Upload proxy log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proxy-log
          path: /tmp/proxy.log
