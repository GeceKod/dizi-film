name: Scheduled Sync

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y xvfb python3-tk python3-dev scrot libx11-dev libxtst-dev sstp-client ppp tinyproxy

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install seleniumbase pyautogui pynput curl_cffi beautifulsoup4 requests tmdbsimple deep-translator
          python -m seleniumbase install chromedriver

      - name: Prepare folders
        run: |
          mkdir -p github_data
          mkdir -p logs

      - name: Connect Keenetic SSTP & Setup Proxy
        env:
          SSTP_USER: ${{ secrets.SSTP_USER }}
          SSTP_PASS: ${{ secrets.SSTP_PASS }}
        run: |
          set -e
          echo "Adim 1: Secret kontrolu..."
